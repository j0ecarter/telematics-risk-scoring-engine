[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "apexrisk"
version = "0.1.0"
description = "Synthetic-first telematics risk-scoring methodology demonstrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ApexRisk contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=17,<24",
    "PyYAML>=6.0,<7.0",
    "statsmodels==0.15.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
apexrisk = "apexrisk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apexrisk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

