# Version 1 assumptions, researched 2026-09-26; synthetic passenger-car scope.
# Full rationale, source qualifications and sensitivity plan:
# docs/telemetry_assumptions.md
telemetry:
  # PROJECT ASSUMPTION: three-sample centred median at 1 Hz suppresses isolated
  # spikes while retaining more short-event detail than a wider window.
  # Validate this compromise with known traces; not an empirical calibration.
  smoothing_window_seconds: 3

  # DERIVED CHOICE: median half-window (1) + central-difference radius (1).
  # Trim both ends of EACH valid segment. Revisit if either method changes.
  edge_trim_seconds: 2

  # PROJECT ASSUMPTION: at least two consecutive qualifying samples at 1 Hz.
  # Sample count approximates duration; short genuine events may be missed.
  minimum_event_duration_seconds: 2

  # PROJECT ASSUMPTION: merge qualifying runs with fewer than three intervening
  # below-threshold samples. Exactly three keeps events separate.
  # Never merge across invalid GPS samples.
  minimum_event_separation_seconds: 3

  # PROJECT ASSUMPTION: suppress low-speed manoeuvres and unstable heading.
  # Speeds below 20 km/h are excluded; exactly 20 km/h is eligible.
  # This intentionally also excludes genuine harsh turns below the gate.
  cornering_minimum_speed_kmh: 20.0

  # PROJECT ASSUMPTION: count only speed STRICTLY ABOVE limit + 5 km/h.
  # Noise buffer, not a legal allowance or Geotab's speeding rule.
  # Compare with 3 and 7 km/h later; this does not eliminate all noise bias.
  speeding_tolerance_kmh: 5.0

  # SOURCE (harsh only): Geotab, GPS-based Passenger class, braking 0.300g.
  # https://support.geotab.com/help/mygeotab/groups-and-rules/rules/rules-overview
  # PROJECT ASSUMPTIONS: moderate 0.20g, severe 0.50g bracket that reference.
  # Convert with g = 9.81 m/s^2; positive braking magnitudes, not signed values.
  # These bands describe this detector, not validated accident-risk categories.
  braking_thresholds_ms2:
    moderate: 1.962
    harsh: 2.943
    severe: 4.905

  # SOURCE (harsh only): same Geotab GPS Passenger table, acceleration 0.300g.
  # PROJECT ASSUMPTIONS: moderate 0.20g and severe 0.50g; same starting bands
  # as braking for simplicity, not evidence that the risks are symmetric.
  acceleration_thresholds_ms2:
    moderate: 1.962
    harsh: 2.943
    severe: 4.905

  # SOURCE (harsh only): same Geotab GPS Passenger table, cornering 0.420g.
  # PROJECT ASSUMPTIONS: moderate 0.30g and severe 0.60g bracket that reference.
  # 0.42 * 9.81 = 4.1202, rounded to three decimals. Not a precision claim.
  cornering_thresholds_ms2:
    moderate: 2.943
    harsh: 4.120
    severe: 5.886

# DESIGN SETTINGS for the future trace generator (task 07).
# Not loaded by EventDetectionConfig and not yet used by the pipeline.
# All numbers here are PROJECT ASSUMPTIONS, not measured GPS performance.
# GPS.gov explains receiver/environment dependence:
# https://www.gps.gov/gps-accuracy
# u-blox MAX-M10S datasheet p4 gives conditional accuracy, NOT noise stddevs:
# https://content.u-blox.com/sites/default/files/MAX-M10S_DataSheet_UBX-20035208.pdf
telemetry_simulation:
  # Independent, zero-mean Gaussian errors per sample/channel before clipping
  # speed to zero and wrapping heading to [0, 360). Use the simulation's seeded RNG.
  # 1.8 km/h (0.5 m/s) speed stddev exercises smoothing with visible jitter.
  speed_noise_std_kmh: 1.8
  # One-degree stddev adds direction jitter; the detector's low-speed gate helps
  # avoid interpreting low-speed direction changes as harsh cornering.
  heading_noise_std_degrees: 1.0

  # While not already in a dropout, each sample has a 0.2% chance to begin one.
  # Start at that sample; draw duration uniformly from integers 1..5 inclusive.
  # Clip at trip end, then resume opportunities; no overlapping dropout starts.
  # About 0.6% invalid samples on long traces, NOT 0.2% invalid samples.
  # This is a controlled robustness scenario, not an observed outage rate.
  dropout_start_probability_per_sample: 0.002
  dropout_duration_min_seconds: 1
  dropout_duration_max_seconds: 5

# Event-rate calibration targets belong to task 09. No universal events/100 km
# target is asserted without a dataset matched to this detector and population.
